<!doctype html>
<html lang="en" data-accent="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt intake</title>
<meta name="description" content="Live receipt intake: D3 checks each upload, Qwen 27B reads only receipts it can read, Qwen 4B explains the rest.">
<script>
  // Theme before first paint: ?theme= from the demos landing page (saved, then dropped from the address), else the
  // stored choice, else the system preference. Arc themes key off data-theme on <html>.
  (function () {
    var q = new URLSearchParams(location.search), t = q.get("theme");
    if (t === "light" || t === "dark") {
      try { localStorage.setItem("theme", t); } catch (e) {}
      q.delete("theme");
      var s = q.toString();
      try { history.replaceState(history.state, "", location.pathname + (s ? "?" + s : "") + location.hash); } catch (e) {}
    } else {
      t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
    }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
