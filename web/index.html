<title>Receipt intake demo · vllm-sr</title>

<meta name="description" content="Live receipt intake: D3 checks each upload, an LLM picked by the vLLM Semantic Router reads only receipts it can read and explains the rest.">
<script>
  // Theme before first paint: ?theme= from the demos landing page (saved, then dropped from the address), else the
  // stored choice, else the system preference. Arc themes key off data-theme on <html>.
  (function () {
    var q = new URLSearchParams(location.search), t = q.get("theme");
    if (t === "light" || t === "dark") {
      try { localStorage.setItem("theme", t); } catch (e) {}
      q.delete("theme");
      var s = q.toString();
      try { history.replaceState(history.state, "", location.pathname + (s ? "?" + s : "") + location.hash); } catch (e) {}
    } else {
      t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
    }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
  // API key hand-off from the demos landing page: #key=<key> (fragments never reach a server). Moved to this tab's
  // sessionStorage and dropped from the address before anything else runs; the app then sends it to POST /api/key.
  (function () {
    var m = /^#key=([^&]*)/.exec(location.hash);
    if (!m) return;
    try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {}
    var k = "";
    try { k = decodeURIComponent(m[1]).trim(); } catch (e) {}
    if (!k) return;
    try { sessionStorage.setItem("vsr-key", k); sessionStorage.setItem("vsr-key-handoff", "1"); } catch (e) {}
  })();
</script>
